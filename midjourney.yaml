steps:
- step: 1
  instruction: Go to midjourney.com/account and sign in. You can also access billing via the /subscribe command in the Midjourney Discord server.
  note: null
- step: 2
  instruction: Click 'Manage Sub' or 'Cancel Plan' on your account page. This redirects to Stripe's billing portal for Midjourney.
  note: null
- step: 3
  instruction: Click 'Cancel Plan' and confirm. Access continues through the end of your billing period. All images you've generated remain accessible in your gallery.
  note: null

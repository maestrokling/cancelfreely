dark_patterns:
- type: skip-before-cancel maze
  description: The cancellation flow strongly pushes the 'Skip a Month' option multiple times before allowing actual cancellation, making it unclear how to fully cancel.
- type: credit forfeiture
  description: Unused book credits (from add-on purchases or accumulated months) are forfeited upon cancellation. This creates sunk-cost pressure to stay subscribed.
retention_tactics:
- Prominently highlights the free skip option as an alternative to cancellation.
- Shows unused book credits that will be lost.
- May offer a discounted rate or bonus credit to stay.
direct_cancel_url: https://www.bookofthemonth.com/my-account
free_alternatives:
- name: Libby (free with library card)

  note: Free ebooks and audiobooks from your local library
- name: Project Gutenberg
  url: https://www.gutenberg.org
  note: Free classic books in digital format
notes: Book of the Month ($16.99/month) sends one hardcover book per month chosen from a curated selection of 5-7 new releases. The skip option is genuinely free and useful — you can skip unlimited months with no penalty. However, the cancellation flow pushes skip so aggressively that it functions as a soft dark pattern. Unused book credits are forfeited upon cancellation, so redeem any accrued credits before canceling. BOTM was acquired by Zola in 2021 and continues to operate as a standalone brand.

notes: '1Password ($2.99-$4.99/month for individual, $4.99/month for families) is one of the cleanest subscription cancellations in the industry — no dark patterns, no retention maze. Vault data stays accessible in read-only mode for 365 days after cancellation, giving ample time to export. Before canceling, export your data: go to your vault and use File > Export. 1Password has no free tier, so if you need a free alternative, Bitwarden is the most commonly recommended option. Business/Teams accounts may need an admin to cancel.'

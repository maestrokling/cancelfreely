steps:
- step: 1
  instruction: Go to 1password.com and sign in to your account.
  note: null
- step: 2
  instruction: Click your name in the top right, then select 'Manage Account' > 'Billing'.
  note: null
- step: 3
  instruction: Click 'Cancel Subscription' and confirm. Your vault data is retained in read-only mode for 365 days after cancellation. You can still export your data during this period.
  note: null

steps:
- step: 1
  instruction: 'IMPORTANT: Get your new insurance policy in place BEFORE canceling GEICO. Never cancel without active replacement coverage — driving uninsured is illegal and creates a coverage gap that raises future premiums.'
  note: null
- step: 2
  instruction: 'Call GEICO: 1-800-841-1587. GEICO does not allow online or app cancellation. Phone is the only method.'
  note: null
- step: 3
  instruction: Tell the representative you want to cancel your policy. Provide your policy number, the cancellation date (typically your new policy's start date), and the reason.
  note: null
- step: 4
  instruction: GEICO will prorate your refund for any unused premium — typically mailed as a check or credited to your payment method within 10-14 business days. Keep your cancellation confirmation number.
  note: null

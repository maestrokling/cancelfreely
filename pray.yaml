steps:
- step: 1
  instruction: Determine where you originally subscribed — web, iOS App Store, or Google Play. You must cancel through the same platform you subscribed on.
  note: null
- step: 2
  instruction: 'iOS: Go to Settings > [your name] > Subscriptions > Pray.com > Cancel Subscription.'
  note: null
- step: 3
  instruction: 'Android: Open Google Play > Profile > Payments & Subscriptions > Subscriptions > Pray.com > Cancel.'
  note: null
- step: 4
  instruction: 'Web: Go to pray.com, sign in, navigate to Account > Manage Subscription > Cancel. The web cancel option may be difficult to find — look under account settings or billing.'
  note: null
- step: 5
  instruction: Confirm cancellation. Access continues through the end of your billing period. Keep confirmation email or screenshot for your records.
  note: null
dark_patterns:
- type: free trial auto-conversion
  description: Pray.com offers a free trial that automatically converts to a paid annual subscription if not canceled before the trial ends. The trial-to-paid conversion is a common complaint.
- type: difficult cancellation
  description: Users report confusion about how to cancel — the app does not make the cancel option obvious, and web cancellation instructions are not prominently documented.
retention_tactics:
- Free trial auto-converts to annual subscription, creating inertia.
- May present inspirational content or daily prayer streaks to encourage continued use during the cancellation flow.
direct_cancel_url: https://pray.com/account
free_alternatives:
- name: Pray.com (free tier)
  url: https://pray.com
  note: Limited free access to some prayers and devotionals
- name: YouVersion Bible App (free)
  url: https://www.youversion.com
  note: Free Bible reading with audio, devotionals, and reading plans
- name: Hallow (free tier)
  url: https://hallow.com
  note: Catholic prayer and meditation app with a free tier
notes: Pray.com Premium costs $9.99/month or $49.99-$69.99/year (pricing varies by promotion) and offers Christian audio content including prayers, Bible stories, meditations, and sleep stories. The primary friction issue is the free trial auto-conversion — many users sign up for a trial not realizing it converts to an annual subscription, then have difficulty getting refunds. The BBB lists numerous complaints about unauthorized charges after trial periods. Cancellation varies by platform (iOS, Android, or web), and the app itself does not make the cancel process obvious. Users should cancel through their device's subscription management rather than looking for a cancel button within the app.

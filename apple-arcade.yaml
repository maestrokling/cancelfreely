notes: Apple Arcade ($6.99/month, also included in Apple One bundles) is an ad-free, in-app purchase-free game subscription for Apple devices. Cancellation follows Apple's standard subscription flow — one of the cleanest in the industry. If you're subscribed through Apple One, you'll need to cancel or downgrade the entire bundle. Game progress saved to iCloud may persist, but access to the games themselves is lost after cancellation. Over 200 games are available, and the catalog rotates.

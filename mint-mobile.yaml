steps:
- step: 1
  instruction: The cleanest way to cancel is to port your number to a new carrier. Initiate the port at the new carrier. You'll need your Mint Mobile account number (found in Account Settings) and transfer PIN.
  note: null
- step: 2
  instruction: 'To cancel without porting: log in at mintmobile.com > Account > Cancel Service. You will lose your phone number if you cancel without porting.'
  note: null
- step: 3
  instruction: Alternatively, call Mint Mobile support at 1-800-683-7392 (or dial 611 from your Mint phone). Phone support can process cancellations and may be faster for complex situations.
  note: null
- step: 4
  instruction: '7-day money-back guarantee: if within 7 days of activation and under 50MB of data used, contact support for a full refund. This applies to new activations only, not renewals.'
  note: null
dark_patterns:
- type: prepaid lock-in
  description: Plans are sold in 3, 6, or 12-month prepaid blocks with no pro-rated refunds for unused months, creating a financial disincentive to cancel mid-term.

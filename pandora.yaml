steps:
- step: 1
  instruction: 'Determine where you subscribed. If via Apple App Store or Google Play, you must cancel through those platforms, not Pandora''s website. iOS: Settings > [your name] > Subscriptions > Pandora > Cancel. Android: Google Play > Profile > Payments & Subscriptions > Pandora > Cancel.'
  note: null
- step: 2
  instruction: 'If subscribed directly through Pandora: go to pandora.com and sign in.'
  note: null
- step: 3
  instruction: Click your profile icon > Settings > Subscription > 'Switch Plan' or 'Cancel'. Pandora may offer a downgrade to Pandora Plus ($4.99/month) instead of full cancellation.
  note: null
- step: 4
  instruction: Confirm cancellation. Access continues through the end of your billing period, then reverts to free ad-supported radio. Your playlists, stations, and listening history are preserved on the free tier.
  note: null
dark_patterns:
- type: misdirection / downgrade nudge
  description: The cancellation flow prominently features a downgrade to Pandora Plus rather than a clean cancel option, making it easy to accidentally switch to a lower-paid tier instead of fully canceling.
retention_tactics:
- Prominently offers a downgrade to Pandora Plus ($4.99/month) before showing the full cancel option.
- Shows a summary of features you will lose (on-demand listening, offline downloads, higher audio quality).
direct_cancel_url: https://www.pandora.com/account/subscription

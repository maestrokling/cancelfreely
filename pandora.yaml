notes: 'Pandora offers three tiers: free (ad-supported radio), Plus ($4.99/month, ad-free with limited skips and offline), and Premium ($10.99/month, full on-demand streaming). Pandora is owned by SiriusXM, which has been consolidating its streaming offerings. The main cancellation friction comes from the downgrade nudge — Pandora steers users toward Plus rather than letting them cancel outright. If you subscribed through Apple or Google, you must cancel through those platforms instead, which adds a layer of confusion. The free tier preserves your stations and listening history, making it a viable fallback.'

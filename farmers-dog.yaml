- step: 2
  instruction: Go to Account > Manage Plan > Cancel Plan. The cancel option may be difficult to find — look under plan management, not general settings.
  note: null
- step: 3
  instruction: Alternatively, email support@thefarmersdog.com to request cancellation. Include your account email and the name of the dog(s) on the plan.
  note: null
- step: 4
  instruction: Cancel before your next order processing date (visible in your account) to avoid the next charge. Orders typically process 2-3 days before the delivery date.
  note: null

notes: 'Crunchyroll ($7.99-$14.99/month depending on tier: Fan, Mega Fan, Ultimate Fan) is the dominant anime streaming platform following its merger with Funimation. The elimination of the free ad-supported tier on December 31, 2025 was a significant change — subscription is now required for any access. If you subscribed through a third-party app store, you must cancel through that platform''s subscription management. Crunchyroll is owned by Sony (via Funimation Global Group) and holds exclusive streaming rights for many major anime titles.'

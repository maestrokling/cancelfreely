steps:
- step: 1
  instruction: Go to crunchyroll.com and sign in.
  note: null
- step: 2
  instruction: Click your profile icon > 'Manage Premium' > 'Cancel Membership'. If subscribed via Apple, Google, Amazon, or Roku, you must cancel through that platform instead.
  note: null
- step: 3
  instruction: Select a cancellation reason and confirm. Access continues through end of billing period.
  note: null
dark_patterns:
- type: free tier elimination
  description: Crunchyroll eliminated its free ad-supported tier on December 31, 2025, removing the fallback option that previously let users watch with ads. Cancellation now means losing all access to the catalog.
- type: platform-specific cancellation
  description: Users who subscribed through third-party platforms (Apple, Google, Roku, Amazon) cannot cancel through the Crunchyroll website — they must navigate to the platform's subscription management, which many users don't realize.
retention_tactics:
- Shows upcoming seasonal anime releases you'll miss.
- May offer a downgrade to a lower tier (Fan vs Mega Fan).
direct_cancel_url: https://www.crunchyroll.com/account/membership

notes: Gaia ($11.99/month or $99/year) is a niche streaming service focused on yoga, meditation, mindfulness, alternative history, and consciousness-expanding content. The lack of a pause option means you must fully cancel and re-subscribe if you want a break — and re-subscribing may not honor your original promotional price. Cancel through whichever platform you originally subscribed. The service has a loyal but niche audience, with content ranging from mainstream yoga to more fringe topics like ancient civilizations and UFOs.

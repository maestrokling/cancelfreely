  instruction: Skype shut down on May 5, 2025. There is nothing to cancel. Microsoft ended Skype after 21 years of operation. All calling subscriptions were automatically terminated.
  note: null
- step: 2
  instruction: Any Skype Credit remaining was available for use until the shutdown date. Subscriptions extending beyond May 1, 2025 were automatically canceled and converted to Skype Credit where applicable. Microsoft provided a migration path to Teams for all Skype users.
  note: null
- step: 3
  instruction: If you're still seeing charges from Skype after May 2025, dispute them with your bank immediately. No legitimate Skype charges should appear after the shutdown date.
  note: null

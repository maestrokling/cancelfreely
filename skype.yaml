notes: Skype officially shut down on May 5, 2025, after 21 years of service. Microsoft automatically migrated user contacts and chat history to Microsoft Teams. If you had a Skype Number, you needed to port it to another carrier before the shutdown date or lose it. Skype Credit balances that remained at shutdown were forfeited unless converted. Any charges appearing after May 2025 are unauthorized and should be disputed with your bank or credit card provider.

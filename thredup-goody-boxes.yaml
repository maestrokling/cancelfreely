notes: ThredUp Goody Boxes are a curated secondhand clothing subscription where a stylist selects items based on your preferences. A non-refundable styling fee of approximately $10 per box is charged regardless of whether you keep any items, though it can be applied as credit toward purchases from that box. The return window is typically 14 days from delivery. Cancel timing is important -- you need to cancel before the next box ships to avoid the styling fee. ThredUp is a publicly traded company (TDUP) focused on the secondhand fashion market, and the Goody Box is one of several subscription-style offerings they have tested.

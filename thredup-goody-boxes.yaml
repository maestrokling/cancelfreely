dark_patterns:
- type: sunk cost styling fee
  description: A non-refundable styling fee ($10) is charged per box regardless of whether you keep any items, which discourages cancellation by making users feel they should 'get their money's worth' from each box.
- type: skip vs cancel confusion
  description: The interface prominently offers 'Skip' as an alternative to canceling, and the skip option auto-resumes, which can lead to unexpected future charges for users who thought they had effectively stopped the service.
retention_tactics:
- Offers a skip option (delay next box) as a prominent alternative to full cancellation.
- Applies the styling fee as a credit toward purchases, incentivizing keeping items rather than canceling.

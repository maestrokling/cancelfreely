  note: Free ad-supported live TV channels and on-demand content
- name: Tubi (free)
  url: https://www.tubi.tv
  note: Free ad-supported on-demand streaming with a large library
- name: Samsung TV Plus (free)
  url: https://www.samsung.com/us/tvplus/
  note: Free live TV channels on Samsung devices and web
notes: Sling TV costs $40/month for Orange or Blue packages, or $55/month for Orange + Blue combined, with add-on channels and DVR increasing the price further. It remains one of the more affordable live TV streaming options with no contract or early termination fee. The $5/month pause option is a genuine alternative if you plan to return, as it preserves your DVR and settings. Sling is owned by Dish Network. The cancellation process is online-only and reasonably clean, though the mandatory pause offer interstitial adds a friction step that some users find manipulative.

notes: 'Birchbox ($15/month for month-to-month) is a beauty and grooming sample subscription box. The key distinction is between month-to-month and term commitment plans: only month-to-month can cancel freely, while 3/6/12-month plans are locked in for the full term. Birchbox has had financial difficulties and changed ownership multiple times — verify current service status and shipping timelines. Loyalty points are forfeited upon cancellation, so redeem any points in the Birchbox Shop before canceling.'

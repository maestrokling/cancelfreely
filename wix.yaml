name: Wix Premium
slug: wix
url: https://www.wix.com
category: domains
cancel_method: online
friction_score: 3
last_verified: '2026-04-13'
steps:
- step: 1
  instruction: Go to wix.com and sign in to your account.
  note: null
- step: 2
  instruction: Click your profile icon, then go to 'Premium Plans' or navigate to 'Billing & Payments' in your account settings.
  note: null
- step: 3
  instruction: Find the plan you want to cancel and click 'Cancel Plan'. Domain registrations and premium website plans are billed separately. Canceling the website plan does NOT cancel your domain.
  note: null
- step: 4
  instruction: Wix will present retention offers and ask for a cancellation reason. Navigate through these screens and confirm. Access continues through the end of the billing period. Your site reverts to the free plan.
  note: null
- step: 5
  instruction: 'To cancel a domain registration: go to Domains in your Wix dashboard > select the domain > Auto-Renew > turn off. Or transfer the domain to another registrar. Domains must be canceled or transferred separately from premium plans.'
  note: null
dark_patterns:
- type: multi-step retention flow
  description: Cancellation requires navigating through multiple retention screens including discount offers, benefit summaries, and 'are you sure' confirmations before reaching the final cancel button.
- type: domain/plan billing confusion
  description: Separate billing for domains and website plans leads many users to believe they have fully canceled when their domain continues to auto-renew, resulting in unexpected charges.
retention_tactics:
- Offers significant discounts (often 50% or more) during the cancellation flow to retain subscribers.
- Displays site statistics, visitor counts, and connected features to create switching anxiety.
- Presents a plan downgrade option before full cancellation.
direct_cancel_url: https://support.wix.com/en/article/canceling-a-wix-premium-plan
free_alternatives:
- name: Wix (free tier)
  url: https://www.wix.com
  note: Free with wixsite.com subdomain and Wix ads displayed on your site
- name: WordPress.com (free tier)
  url: https://wordpress.com
  note: Free website with wordpress.com subdomain
- name: Google Sites (free)
  url: https://sites.google.com
  note: Free basic website builder included with Google account
notes: Wix Premium plans range from $17/month (Light) to $159/month (Business Elite), billed annually, with monthly billing costing significantly more. After canceling a premium plan, your site reverts to the free tier with a wixsite.com subdomain and Wix advertising displayed on your pages. The most common cancellation pitfall is the separate billing for domain registrations -- canceling your premium plan does not stop domain auto-renewal, and many users report being surprised by continued charges. Wix does not offer prorated refunds for annual plans canceled mid-term unless you are within 14 days of purchase. The platform has become increasingly aggressive with retention offers during cancellation, often presenting steep discounts that can make it worth attempting to cancel even if you plan to stay.

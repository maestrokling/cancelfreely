notes: 'Costco has one of the most consumer-friendly cancellation policies of any membership service: full refund at any time, no questions asked, no proration, no penalty. This applies to both Gold Star ($65/year) and Executive ($130/year) memberships. The policy is genuine — Costco''s 90%+ renewal rate reflects that members stay because of value, not because leaving is hard. This is frequently cited as the gold standard for subscription cancellation policies. Note that Costco does not offer online cancellation, but the in-store and phone processes are both frictionless.'

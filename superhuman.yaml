steps:
- step: 1
  instruction: 'In the Superhuman app (Mac/Windows): press Cmd+K (Mac) or Ctrl+K (Windows), type ''Cancel Subscription'', and follow the prompts. The command palette is the fastest way to reach cancellation.'
  note: null
- step: 2
  instruction: Alternatively, go to superhuman.com/admin and click on 'Billing', then 'Cancel subscription'. You must be the account owner or billing admin for team accounts.
  note: null
- step: 3
  instruction: Select a cancellation reason and confirm. Access continues through the end of the billing period.
  note: null
- step: 4
  instruction: If you cannot find the cancel option or have a team/enterprise contract, email support@superhuman.com. Enterprise contracts may have minimum commitment periods and require written notice.
  note: null

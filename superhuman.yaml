notes: Superhuman costs $30/month per user, making it one of the most expensive email clients on the market. The value proposition centers on speed, keyboard shortcuts, AI triage, and read status tracking. After canceling, your underlying email account (Gmail, Outlook, etc.) is completely unaffected -- you simply lose the Superhuman interface layer. There is no data loss risk since Superhuman does not store your email. Team and enterprise plans may have annual commitments with different cancellation terms. Superhuman has grown significantly since removing its waitlist model and now targets business teams rather than individual productivity enthusiasts.

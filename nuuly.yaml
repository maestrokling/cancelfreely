notes: Nuuly ($98/month as of 2025, up from $88) is a clothing rental subscription owned by URBN (parent of Urban Outfitters, Anthropologie, Free People). Members rent 6 items per month and return them at the end of each cycle. The cancellation process is straightforward online, though Nuuly does present a pause option and shows rental value summaries. The main friction point is remembering to return rented items before canceling — unreturned items will be charged to your card at retail price. Nuuly has been expanding its resale marketplace (Nuuly Thrift) as a secondary business line.

  url: https://www.spotify.com
  note: Free with ads and shuffle-only on mobile
- name: YouTube Music (free tier)
  url: https://music.youtube.com
  note: Free with ads
notes: 'Amazon Music Unlimited ($10.99/month standalone, $9.99/month for Prime members, $5.99 for students) provides full on-demand catalog access with spatial audio. The main confusion point is Amazon''s three-tier music hierarchy: canceling Unlimited does not cancel your Prime membership or remove Prime Music access. If you subscribed through a third-party app store (Apple, Google), you must cancel through that platform. Amazon frequently offers promotional pricing during the cancellation flow, which has been reported as genuinely available and worth considering if you''re on the fence.'

steps:
- step: 1
  instruction: Go to amazon.com and sign in.
  note: null
- step: 2
  instruction: Go to Account & Lists > Memberships & Subscriptions. Or go directly to amazon.com/music/settings.
  note: null
- step: 3
  instruction: Find Amazon Music Unlimited and click 'Cancel subscription'.
  note: null
- step: 4
  instruction: Follow the prompts and confirm cancellation. If subscribed via Apple App Store or Google Play, you must cancel through those platforms instead.
  note: null
- step: 5
  instruction: Access continues through end of billing period. Downloaded music for offline listening will become unplayable after cancellation.
  note: null
dark_patterns:
- type: confusing service hierarchy
  description: Amazon has three music tiers — Amazon Music Free, Amazon Music Prime (included with Prime), and Amazon Music Unlimited. Many users don't realize canceling Unlimited still gives them a limited catalog through Prime, creating confusion about what exactly they're paying for and losing.
- type: buried cancel option
  description: The cancel option is nested several layers deep in Amazon's account management system. Users must navigate through Memberships & Subscriptions rather than having a direct cancel button in the music app.
retention_tactics:
- Offers a discounted rate (often $7.99/month for 3 months) during cancellation flow.
- Shows upcoming exclusive releases and playlists you'll lose access to.
- Offers a free trial extension for new subscribers attempting to cancel.
direct_cancel_url: https://www.amazon.com/music/settings
free_alternatives:
- name: Amazon Music (free with Prime)
  url: https://music.amazon.com
  note: Limited catalog with shuffle-only playback included with Amazon Prime membership

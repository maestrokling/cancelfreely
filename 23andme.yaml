  note: null
dark_patterns:
- type: data hostage
  description: Canceling the subscription does not delete your genetic data. Users must navigate to a completely separate settings page to request data deletion, and the process takes up to 30 days. Many users cancel thinking their data is gone.
- type: loss aversion messaging
  description: Cancellation flow emphasizes health reports, pharmacogenomics insights, and ancestry updates you'll lose access to, creating anxiety about losing health-related information.
retention_tactics:
- Emphasizes loss of ongoing health report updates and pharmacogenomics data.
- May offer a discounted annual rate during cancellation flow.
direct_cancel_url: https://customercare.23andme.com/hc/en-us/articles/10327142222359-Canceling-your-Premium-Membership
free_alternatives: []
notes: 23andMe filed for Chapter 11 bankruptcy in November 2024, raising major concerns about customer genetic data privacy and ownership. The California Attorney General issued guidance urging users to consider deleting their data. As of 2025, the company was exploring acquisition by private equity, with data rights being a central concern. The Premium subscription ($29/year) provides ongoing health reports and pharmacogenomics — canceling it does not remove your DNA data from their servers. If data privacy is your concern, you must separately request full data deletion through the account settings. This is one of the few services where the data implications of cancellation are more important than the subscription cost itself.

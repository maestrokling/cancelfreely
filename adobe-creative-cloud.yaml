steps:
- step: 1
  instruction: Go to account.adobe.com and sign in.
  note: null
- step: 2
  instruction: Click 'Plans' then select 'Manage plan' next to your Creative Cloud subscription.
  note: null
- step: 3
  instruction: 'Click ''Cancel plan'' and follow the prompts. CRITICAL: If you are within 14 days of purchase, cancellation is free. After 14 days, Adobe charges an Early Termination Fee of 50% of the remaining contract balance. On a $59.99/month annual plan, this can be hundreds of dollars.'
  note: null
- step: 4
  instruction: Navigate through multiple retention screens before reaching the final confirmation. Adobe will offer discounts, pauses, and downgrades before allowing cancellation.
  note: null
dark_patterns:
- type: hidden early termination fee
  description: Adobe's annual plan (billed monthly) includes a 50% ETF on remaining balance if canceled after 14 days. This fee was hidden behind 'fine print and inconspicuous hyperlinks' at signup — the subject of a $150 million class action settlement in 2026.
- type: bait-and-switch pricing
  description: Adobe advertises introductory monthly rates (e.g., $34.99/month) that revert to full price ($69.99/month) after 3 months, with the full terms buried behind a 'view terms' link most users miss.
- type: multi-screen retention maze
  description: Adobe uses multiple screens with discount offers, plan pauses, and emotional appeals before allowing cancellation to proceed.
retention_tactics:
- Offers a 2-3 month pause instead of canceling.
- Offers a significant discount (up to 40%) to stay.
- Offers a downgrade to a single-app plan.
- Shows all the apps you'll lose access to.
direct_cancel_url: https://account.adobe.com/plans

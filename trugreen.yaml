- step: 2
  instruction: 'State clearly you want to cancel your lawn care plan. Have your account number ready. Agents will make retention offers. Be direct: ''I want to cancel, please do not schedule any more services.'''
  note: null
- step: 3
  instruction: Confirm your cancellation date and that no further services will be performed. Get a confirmation number.
  note: null
- step: 4
  instruction: Watch your property for the next 2-4 weeks. TruGreen has documented cases of continuing service after cancellation — verify no technicians visit.
  note: null
dark_patterns:
- type: service after cancellation
  description: TruGreen has a well-documented pattern of continuing to send technicians and bill customers after cancellation. Reddit and BBB have multiple accounts of customers canceling and then finding TruGreen treated their lawn anyway — and sent a bill.
- type: automatic plan re-enrollment
  description: TruGreen auto-enrolls customers into the next year's plan at the end of the season. Many customers don't realize they've been re-enrolled until they receive a spring service they didn't request.
retention_tactics:
- Offers a re-application visit for free.
- Offers a discounted rate for the remainder of the season.

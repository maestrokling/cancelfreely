notes: Claude Pro ($20/month) provides increased usage limits, priority access during peak times, and access to the latest Claude models. It is one of the cleanest AI subscription cancellations — no dark patterns, no retention maze, direct URL to billing works. Conversation history is preserved after cancellation and accessible on the free tier. If you subscribed through the iOS App Store, you must cancel through Apple's subscription management (Settings > Subscriptions) rather than the web interface.

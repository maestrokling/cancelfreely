notes: Panera Unlimited Sip Club costs $14.99/month (price increased from $11.99 in 2024) and includes unlimited self-serve drinks — coffee, tea, fountain beverages, and charged lemonades — at Panera Bread locations. The subscription must be redeemed in-store, so it only makes financial sense if you visit Panera regularly. Panera faced controversy in 2024 over its Charged Lemonade drinks (high caffeine content leading to health incidents and lawsuits), which led to reformulation. Cancellation is straightforward through the website or app, though the savings summary during the cancel flow is a mild loss-aversion tactic. No refund for unused time.

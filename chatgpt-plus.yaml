steps:
- step: 1
  instruction: Go to chat.openai.com and sign in.
  note: null
- step: 2
  instruction: Click your profile icon in the bottom left, then select 'Settings'.
  note: null
- step: 3
  instruction: Go to 'Account' (not the 'Manage' button under payments — use the first 'Manage' button in the subscription section). Users report confusion between two 'Manage' buttons — use the one directly under your subscription details, not the payments section.
  note: null
- step: 4
  instruction: Click 'Cancel plan' and confirm. Access continues through the end of the billing period. Reverts to the free tier (GPT-4o with usage limits).
  note: null

steps:
- step: 1
  instruction: Cancel method depends on where you subscribed — check your original purchase confirmation email.
  note: null
- step: 2
  instruction: 'iOS: Settings > [your name] > Subscriptions > Headspace > Cancel Subscription.'
  note: null
- step: 3
  instruction: 'Android: Google Play > Profile > Payments & Subscriptions > Subscriptions > Headspace > Cancel.'
  note: null
- step: 4
  instruction: 'Web (direct): headspace.com > Profile > Settings > Subscription > Cancel.'
  note: null
dark_patterns:
- type: app deletion doesn't cancel
  description: Deleting or uninstalling Headspace does not cancel the subscription. Must cancel through originating platform.
retention_tactics:
- None significant.
direct_cancel_url: https://help.headspace.com/hc/en-us/articles/115008364988
free_alternatives:

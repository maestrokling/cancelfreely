notes: Dollar Shave Club ($5-$10+/month depending on products) ships razors and grooming products on a recurring basis. The company was sold by Unilever to Nexus Capital in 2023 and has restructured operations. Cancellation is online but requires navigating a multi-step flow with retention offers. Each product subscription must be canceled individually — there's no single 'cancel all' button. DSC razor handles work with standard cartridges, so you can continue using the handle after canceling and buy replacement cartridges elsewhere.

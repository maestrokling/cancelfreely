  instruction: State clearly you want to cancel — agents will make retention offers. OnStar charges $25-$50+/month depending on plan tier.
  note: null
dark_patterns:
- type: retention-first phone flow
  description: OnStar phone cancellation routes through retention specialists who make multiple offers. Users report needing to decline discounts and downgrades before cancellation is processed.

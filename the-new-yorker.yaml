steps:
- step: 1
  instruction: 'Try online first: go to condenaststore.com/new-yorker or the Condé Nast customer service portal and sign in. The New Yorker is published by Condé Nast. Cancellation often routes through Condé Nast''s subscriber services, not The New Yorker''s own website.'
  note: null
- step: 2
  instruction: 'If online cancellation is unavailable or you get stuck in a loop, call: 1-800-825-2510. Multiple users report that the New Yorker website loops back without offering a cancel option as of October 2025.'
  note: null
- step: 3
  instruction: If you subscribed through a reseller or third party, you may get a 'token has expired' error on the website — call instead.
  note: null
- step: 4
  instruction: Confirm cancellation and keep any email confirmation. If on an annual plan, you may receive a pro-rata refund for unused months.
  note: null
dark_patterns:

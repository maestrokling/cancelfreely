steps:
- step: 1
  instruction: Go to hims.com (or hers.com) and sign in.
  note: null
- step: 2
  instruction: Go to your profile > 'Subscriptions' > select the subscription to cancel > 'Cancel Subscription'.
  note: null
- step: 3
  instruction: ⚠️ Cancel at least 48 hours before your next order date to avoid being charged and shipped the next order. Hims processes and ships orders before the billing date. Missing the 48-hour window means you'll receive and be charged for the next shipment.
  note: null
- step: 4
  instruction: Verify cancellation — some users report the account shows 'canceled' but a next refill date still appears. Confirm with support if unclear.
  note: null
dark_patterns:
- type: confusing cancellation confirmation
  description: Multiple BBB complaints describe accounts showing as 'canceled' while still displaying a next refill date — creating confusion about whether cancellation was processed. Some users were charged and shipped after believing they had canceled.
- type: 48-hour order deadline
  description: Hims processes orders well before the billing/ship date. Missing the 48-hour cancellation window results in a charge and shipment you cannot return.
retention_tactics:
- May offer a pause or reduced-frequency delivery instead of canceling.
direct_cancel_url: https://support.hims.com/hc/en-us/articles/360000962263
free_alternatives: []
notes: Hims/Hers is a telehealth and subscription wellness brand (hair loss, ED, skincare, etc.). Cancel well in advance of your next order date — the 48-hour rule is strictly enforced. If you cancel and are still charged, contact support immediately; refunds are sometimes available for the most recent shipment.

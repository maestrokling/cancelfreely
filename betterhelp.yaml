  instruction: Follow the prompts to confirm. You'll receive a confirmation email. Consider your ongoing therapy needs before canceling. If you want to pause rather than cancel, BetterHelp allows pauses of up to 4 weeks.
  note: null
dark_patterns:
- type: FTC settlement (2023)
  description: BetterHelp paid $7.8M in FTC refunds in 2023 for sharing user mental health data with Facebook and Snapchat for advertising despite promising not to. This was a data privacy issue, not a cancellation dark pattern, but is material context.
retention_tactics:

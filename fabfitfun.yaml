notes: FabFitFun ($59.99/season for seasonal, $199.99/year for annual) is a quarterly lifestyle subscription box with beauty, fitness, home, and wellness products. Each box is valued at $200+ in retail products. The main friction is the seasonal billing cycle — cancel before the seasonal charge date (roughly early February, May, August, November) to avoid the next box. Annual subscribers cannot get refunds for remaining boxes. FabFitFun's 'Select' members get to choose more items, which creates additional switching cost.

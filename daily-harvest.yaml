notes: Daily Harvest delivers pre-portioned, plant-based smoothies, harvest bowls, flatbreads, and snacks. Pricing varies by plan size ($6-$12 per item depending on quantity). The company faced a major recall in 2022 (French Lentil + Leek Crumbles linked to liver illness), which damaged consumer trust. No long-term contract, but the weekly order cutoff window creates practical friction — if you miss it, you're charged. The pause option is genuinely useful if you just need a break rather than a full cancellation.

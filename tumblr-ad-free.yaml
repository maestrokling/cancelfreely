steps:
- step: 1
  instruction: 'Determine how you subscribed: through the Tumblr website, Apple App Store, or Google Play. If subscribed via a mobile app store, you must cancel through that platform.'
  note: null
- step: 2
  instruction: 'For web subscriptions: Go to tumblr.com, sign in, click your account icon > Settings > scroll to the subscription section > Cancel.'
  note: null
- step: 3
  instruction: 'For Apple: Settings > [your name] > Subscriptions > Tumblr > Cancel. For Google Play: Play Store > Profile > Payments & subscriptions > Subscriptions > Tumblr > Cancel.'
  note: null
- step: 4
  instruction: Access continues through the end of the billing period. Ads return after your subscription expires. Your blog content, followers, and settings are completely unaffected by canceling the ad-free subscription.
  note: null

notes: Tumblr Ad-Free costs $4.99/month or $39.99/year and removes ads from the dashboard feed. The subscription is Tumblr's primary revenue model after the platform was acquired by Automattic (WordPress parent company) from Verizon in 2019 for a fraction of its original purchase price. Cancellation is clean and straightforward with no aggressive retention tactics. The ad-free tier is explicitly marketed as a way to support the platform financially, which Tumblr leans into given its well-documented financial challenges. No content or functionality is lost upon cancellation -- only ads return to the feed.

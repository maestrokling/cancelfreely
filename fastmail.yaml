notes: 'Fastmail ($3-$9/month depending on plan: Standard, Premium) is an Australian privacy-respecting email provider that does not scan emails for advertising. Cancellation is clean with advance renewal reminders — no dark patterns, no retention maze. Before canceling, export your email using Settings > Export (MBOX format). If you''re using a custom domain with Fastmail, update your domain''s MX records to point to your new provider before canceling to avoid losing incoming mail. Fastmail is employee-owned and has been operating since 1999.'

dark_patterns:
- type: skip-vs-cancel confusion
  description: Factor's cancellation flow prominently surfaces 'skip a week' and 'pause' options before the cancel path, making it easy to accidentally skip rather than cancel. Many users think they've canceled when they've only skipped.
- type: Wednesday cutoff deadline
  description: Factor processes charges and prepares meals weekly. Missing the Wednesday 11:59 PM CT cutoff means you'll receive and be billed for the next week's box even if you cancel immediately after.

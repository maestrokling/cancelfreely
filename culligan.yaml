  url: null
  note: Purchasing your own filtration eliminates the ongoing rental relationship
notes: Culligan is a franchise — your experience depends heavily on your local dealer. The rental equipment return is the key logistical step. Get a receipt when equipment is picked up. If your Culligan service includes a long-term service contract (common for commercial water treatment), review it carefully for early termination terms before canceling.

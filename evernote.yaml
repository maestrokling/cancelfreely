- name: Apple Notes
  url: null
  note: Free, built into Apple devices, syncs via iCloud
- name: Google Keep
  url: https://keep.google.com
  note: Free note-taking with Google account
notes: Evernote ($14.99/month Personal, $17.99/month Professional) has undergone significant changes including acquisition by Bending Spoons in 2023, layoffs of most staff, and drastic free tier limitations (1 notebook, 50 notes). The crippled free tier is widely considered one of the most aggressive dark patterns in the productivity space — users with years of accumulated notes are effectively forced to pay or lose access. Before canceling, export all notes in ENEX format and import into an alternative like Notion (which has a built-in ENEX importer) or Obsidian. Given Evernote's uncertain future, exporting your data is advisable regardless of whether you plan to cancel.

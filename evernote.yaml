  instruction: Click your profile icon, then go to 'Settings' > 'Billing'.
  note: null
- step: 3
  instruction: Click 'Cancel subscription' and follow the prompts. If subscribed via Apple App Store or Google Play, cancel through those platforms instead.
  note: null
- step: 4
  instruction: 'IMPORTANT: Export your notes before cancellation if you have more than 50 notes. The free tier limits you to 1 notebook and 50 notes. Use File > Export All Notes to save in ENEX format. Consider importing to Notion, Obsidian, or OneNote.'
  note: null
dark_patterns:
- type: crippled free tier
  description: The free tier was drastically reduced to 1 notebook and 50 notes, making it essentially unusable as a fallback. Users with years of notes face losing access to their data unless they pay or export.
- type: data hostage
  description: Notes beyond the free tier limit become inaccessible (not deleted, but locked behind the paywall). Users must either continue paying or go through the export process to retrieve their own data.
- type: export friction
  description: While export exists, it's not prominently featured and the ENEX format requires third-party tools to import into competing services, adding friction to leaving.
retention_tactics:
- May offer a discounted rate during cancellation flow.
- Shows how many notes exceed the free tier limit, creating urgency.
- Highlights features like search, offline access, and PDF annotation you'll lose.
direct_cancel_url: https://www.evernote.com/Settings.action
free_alternatives:

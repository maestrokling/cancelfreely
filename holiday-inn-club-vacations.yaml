- step: 2
  instruction: 'Within the rescission period: Write a rescission letter with your contract number, purchase date, and a clear statement that you are exercising your right of rescission. All signers must sign.'
  note: null
- step: 3
  instruction: Send via USPS Certified Mail with Return Receipt to the address specified in your contract. Postmark controls the deadline. Keep the tracking receipt and signed return receipt card as permanent proof.
  note: null
- step: 4
  instruction: 'After the rescission period: Contact Holiday Inn Club Vacations owner services: 1-888-465-4329. Request information on their official voluntary surrender or deed-back program. Eligibility for deed-back typically requires the account to be current on all fees and loan payments.'
  note: null
- step: 5
  instruction: ⚠️ Avoid upfront-fee exit companies. Holiday Inn Club Vacations (owned by Orange Lake Resorts / IHG Hotels & Resorts) operates legitimate exit programs — use those first.
  note: null

steps:
- step: 1
  instruction: Go to namecheap.com and sign in to your account.
  note: null
- step: 2
  instruction: 'For domains: Go to Domain List > find the domain > click ''Manage'' > toggle ''Auto-Renew'' off. The domain remains active until its expiration date and simply won''t be renewed.'
  note: null
- step: 3
  instruction: 'For hosting products: Go to Hosting List > find the hosting plan > click ''Manage'' > Cancel or turn off auto-renewal. Back up your website files and databases before canceling hosting.'
  note: null
- step: 4
  instruction: 'For other products (SSL, VPN, email): navigate to the specific product dashboard and disable auto-renewal or cancel. Domains that are not renewed enter a grace period (typically 30 days), then a redemption period (30 days at an additional fee), before full release.'
  note: null

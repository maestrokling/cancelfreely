name: Peloton
slug: peloton
url: https://www.onepeloton.com
category: fitness
cancel_method: online
friction_score: 3
last_verified: '2026-04-13'
steps:
- step: 1
  instruction: Go to members.onepeloton.com and sign in. Cancellation cannot be done from the Peloton bike/tread touchscreen or the mobile app — you must use the website.
  note: null
- step: 2
  instruction: Click your profile icon in the top right, then select 'Memberships'.
  note: null
- step: 3
  instruction: Click 'Cancel Membership' next to the membership you want to cancel. You can cancel All-Access (equipment-linked, ~$44/month) or the App membership (~$12.99/month) separately.
  note: null
- step: 4
  instruction: Walk through the cancellation flow — Peloton will present retention offers and alternatives. Peloton will offer a pause, a discounted rate, and show upcoming classes before giving you the final cancel button.
  note: null
- step: 5
  instruction: Confirm cancellation. If you own Peloton equipment, it still functions for manual workouts after canceling. You lose access to live and most on-demand classes, but some limited free content remains.
  note: null
dark_patterns:
- type: FOMO / loss aversion
  description: During the cancellation flow, Peloton highlights upcoming live classes, instructor events, and new content releases to trigger fear of missing out.
- type: obstacle course cancellation
  description: The cancellation flow requires navigating through multiple screens — a pause offer, a discount offer, a feature summary, and a survey — before reaching the actual cancel confirmation.
retention_tactics:
- Offers a membership pause (1-3 months) before allowing cancellation.
- Presents a discounted rate (commonly 50% off for 2-3 months) to retain you.
- Highlights upcoming live classes and instructor milestones to trigger FOMO.
direct_cancel_url: https://members.onepeloton.com/membership
free_alternatives:
- name: YouTube fitness channels
  url: https://www.youtube.com
  note: Free cycling, running, strength, and yoga workouts
- name: Nike Training Club
  url: https://www.nike.com/ntc-app
  note: Free guided workouts across multiple categories
- name: Apple Fitness+ (with Apple device)
  url: https://www.apple.com/apple-fitness-plus/
  note: Included free with some Apple devices, $9.99/month otherwise
notes: 'Peloton has two main subscription tiers: All-Access ($44/month, required to unlock full content on Peloton equipment) and App ($12.99/month, for non-equipment users). The cancellation process requires going through multiple retention screens — pause offers, discount offers, and FOMO-inducing content previews — which earns a friction score of 3. Equipment owners who cancel lose most class content but can still use their bike or tread for manual workouts. Peloton has been through significant financial turmoil since 2022, including layoffs and debt restructuring, but continues to operate. The company introduced a rental/financing program for equipment and has been expanding into non-equipment content to broaden its subscriber base.'

steps:
- step: 1
  instruction: Open the Lemonade app or go to lemonade.com and sign in. The app provides the smoothest cancellation experience.
  note: null
- step: 2
  instruction: Navigate to your policy, then tap/click 'Cancel Policy'. Available directly in the app with no retention maze. One of the cleanest insurance cancellation experiences available.
  note: null
- step: 3
  instruction: Select your cancellation date and confirm. Lemonade prorates and refunds unused premium automatically. Refunds typically appear within 5-10 business days.
  note: null
- step: 4
  instruction: If you have active claims, those will be processed regardless of cancellation. Ensure you have replacement coverage in place before your Lemonade policy ends to avoid a coverage gap.
  note: null

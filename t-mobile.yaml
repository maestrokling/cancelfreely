  instruction: 'Fastest method: Port your number to the new carrier. Number porting automatically cancels T-Mobile service. If you''re switching carriers, initiate the port at the new carrier — you do not need to call T-Mobile first.'
  note: null
- step: 2
  instruction: 'To cancel without porting: Call T-Mobile at 1-877-453-1304 or visit a T-Mobile store.'
  note: null

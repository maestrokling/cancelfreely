  instruction: Go to Settings > Account Details > Cancel Account. The cancel option is in 'Account Details' — not the obvious 'Subscription' section.
  note: null
- step: 3
  instruction: Hungryroot will ask if you want to take a break (pause) instead. Click 'Continue to Cancel' to proceed.
  note: null

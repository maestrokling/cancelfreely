  instruction: 'iOS: Settings > [your name] > Subscriptions > Noggin > Cancel Subscription.'
  note: null
- step: 3
  instruction: 'Android: Google Play Store > Profile > Payments & Subscriptions > Subscriptions > Noggin > Cancel.'
  note: null
- step: 4
  instruction: 'Amazon: Go to amazon.com > Account > Memberships & Subscriptions > Noggin > Cancel.'
  note: null
- step: 5
  instruction: 'Direct web subscription: Go to noggin.com > Account > Manage Subscription > Cancel. Access continues through end of billing period. Downloaded content for offline viewing will become unavailable after expiration.'

notes: Instacart+ ($99/year or $9.99/month) provides free delivery on orders over $35, reduced service fees, and credit back on pickup orders. The cancellation flow is functional but employs several retention patterns including personalized savings data and confirmshaming language. Instacart+ also bundles a Peacock Premium subscription, which cancels separately through Peacock. The FTC's click-to-cancel rule finalized in 2024 may pressure Instacart to simplify its cancellation flow. Note that Instacart+ benefits do not apply to orders from all retailers.

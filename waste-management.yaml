steps:
- step: 1
  instruction: 'For residential service: Call WM Customer Service at 1-800-592-9995 (Mon-Fri 7am-7pm, Sat 9am-1pm) or email via wm.com. For commercial service: the process differs significantly — see notes below.'
  note: null
- step: 2
  instruction: State you want to cancel and provide your account number and service address.
  note: null
- step: 3
  instruction: Arrange return or pickup of WM-owned bins/containers if applicable. Keeping their equipment may result in additional charges.
  note: null
- step: 4
  instruction: Get a cancellation confirmation and final bill amount. Check for any early termination fees in your service agreement.
  note: null
dark_patterns:
- type: commercial contract auto-renewal with evergreen clause
  description: WM commercial contracts contain 'evergreen' auto-renewal clauses — if you don't cancel within a specific window before the end of the contract term (often 60-90 days), the contract auto-renews for another full term (1-3 years). Missing this window locks you in. This is one of the most documented contract traps in commercial waste services.
- type: price escalation
  description: WM contracts allow for annual price increases (fuel surcharges, environmental fees, rate adjustments) that can significantly increase your effective rate over the contract term.
retention_tactics:
- May offer a rate reduction to stay.
direct_cancel_url: https://www.wm.com/us/en/contact-us.html
free_alternatives:
- name: Local municipal waste service
  url: null
  note: Check if your municipality provides residential collection — often cheaper
notes: 'Residential WM cancellation is relatively straightforward — call or email, arrange container return. Commercial WM contracts are a different matter entirely: read your contract for the auto-renewal notice window (often 60-90 days before contract end) and mark your calendar. Missing that window means another full term. If you''re a commercial customer who missed the window, consult a contract attorney.'

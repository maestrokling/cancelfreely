  note: null
- step: 4
  instruction: 'Web (if subscribed via tinder.com): Go to tinder.com > Profile > Settings > Manage Payment Account > Cancel Subscription.'
  note: null
dark_patterns:
- type: app deletion doesn't cancel
  description: Deleting the Tinder app does not cancel the subscription — charges continue. This trips up a large number of users who assume deletion = cancellation.
- type: cancellation method depends on signup platform
  description: You must cancel through the same platform where you subscribed (Apple, Google, or web). If you subscribed via iOS and try to cancel in the app, there is no cancel button — you must go to Apple Settings.
retention_tactics:
- None at the app store level — Apple/Google handle the flow.

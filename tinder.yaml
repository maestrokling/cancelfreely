  instruction: '⚠️ CRITICAL: Deleting the Tinder app does NOT cancel your subscription. You will keep being charged.'
  note: null
- step: 2
  instruction: 'iOS: Open Settings > [your name] > Subscriptions > Tinder > Cancel Subscription.'
  note: null
- step: 3

notes: Proton Mail is widely considered one of the most ethical tech companies in terms of cancellation experience. Paid plans start at $3.99/month (Mail Plus) with 15GB storage and 10 email addresses, up to $12.99/month (Proton Unlimited) which bundles Mail, VPN, Drive, Calendar, and Pass. Cancellation is a downgrade to the generous free tier — your account, email address, and existing messages are fully preserved. The only practical friction is managing storage if you exceed the 1GB free limit. Custom domain email addresses stop functioning on the free tier, so users should plan for that before downgrading. Proton is based in Switzerland and subject to Swiss privacy laws, which is a key selling point of the service.

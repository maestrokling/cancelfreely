- step: 2
  instruction: Navigate to Dashboard (or Plans) in the left sidebar.
  note: null
- step: 3
  instruction: Click 'Downgrade account' or 'Switch to Free' at the bottom of the plans page. This is a downgrade to the free tier, not a full account deletion. Your email address and existing emails are preserved.
  note: null
- step: 4
  instruction: Confirm the downgrade. If you exceed free tier storage limits (1GB), you will need to delete emails or attachments to get under the cap. Your custom domain email addresses (if any) will stop working on the free tier. Download important emails before downgrading if you use custom domains.
  note: null

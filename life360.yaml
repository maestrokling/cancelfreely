steps:
- step: 1
  instruction: Determine where you subscribed — directly through Life360, Apple App Store, or Google Play. Cancel method depends on your original subscription platform.
  note: null
- step: 2
  instruction: 'iOS App Store: Settings > [your name] > Subscriptions > Life360 > Cancel Subscription.'
  note: null
- step: 3
  instruction: 'Google Play: Google Play Store > Profile > Payments & Subscriptions > Subscriptions > Life360 > Cancel.'
  note: null
- step: 4
  instruction: 'Direct web subscription: Go to life360.com > Settings > Manage Membership > Cancel Membership. You may need to log in on the web even if you primarily use the app.'
  note: null
- step: 5
  instruction: Access continues through end of billing period. The free tier with basic location sharing remains active. Premium features like crash detection, roadside assistance, and extended location history will be disabled.
  note: null
dark_patterns:
- type: loss aversion messaging
  description: Cancellation flow shows a list of premium features you'll lose, including crash detection and SOS alerts, framing the downgrade as a safety risk for your family.
- type: privacy concerns as retention
  description: Life360 has faced scrutiny for selling precise user location data to data brokers, creating a tension where the service you're paying for may also be monetizing your data.
retention_tactics:
- Presents a feature comparison showing what you'll lose versus the free tier.
- Emphasizes family safety features like crash detection and emergency SOS.
- May offer a discounted renewal rate or plan switch.

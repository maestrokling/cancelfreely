notes: Life360 ($7.99/month Gold, $19.99/month Platinum) adds crash detection, roadside assistance, extended location history, and identity theft protection to the free family location-sharing app. The company faced a major privacy scandal when The Markup revealed it was selling precise user location data to data brokers like X-Mode and Cuebiq. Life360 subsequently pledged to stop selling raw location data, but the episode highlights the privacy trade-offs of location tracking apps. Cancellation follows standard app store patterns and is reasonably clean. The free tier provides core location sharing without a subscription.

steps:
- step: 1
  instruction: Go to ring.com/account and sign in, or open the Ring app on your phone.
  note: null
- step: 2
  instruction: Navigate to Account > Subscriptions (web) or tap the menu icon > Account > Subscriptions (app).
  note: null
- step: 3
  instruction: Select the Ring Protect plan you want to cancel and click 'Cancel Plan'. If you have multiple Ring devices, you may have per-device Basic plans or a whole-home Plus/Pro plan.
  note: null
- step: 4
  instruction: Confirm cancellation. No contract, no early termination fee. After canceling, Ring cameras continue to work for live viewing and motion alerts. You lose cloud video recording, video history, and person detection features. Existing saved videos will be deleted after the plan expires.
  note: null
dark_patterns:
- type: functionality degradation warning
  description: Ring emphasizes during cancellation that your cameras will lose cloud recording and video history, creating anxiety about home security gaps even though live viewing still works.
retention_tactics:
- Shows a summary of how many videos were captured and events detected, emphasizing the value of cloud recording.
- May offer an annual plan discount if you are on a monthly plan.
direct_cancel_url: https://account.ring.com/account/subscriptions

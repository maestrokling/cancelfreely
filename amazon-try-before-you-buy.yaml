notes: Amazon Try Before You Buy (formerly Prime Wardrobe) is a Prime benefit, not a separate subscription. You try up to 8 items for 7 days, return what you don't want, and only pay for what you keep. The key thing to know is the strict 7-day return window — if you miss it, you're charged for everything. No monthly fee beyond your existing Prime membership. This service has been scaled back significantly since its 2018 launch, with reduced eligible item selection.

dark_patterns:
- type: storage hostage
  description: If you're over the 15GB free limit, canceling means you can't upload new files, receive new emails (if Gmail is full), or sync new photos. Google doesn't delete your files but makes them effectively frozen.
- type: shared storage confusion
  description: Google One storage is shared across Gmail, Drive, and Photos. Users often don't realize that canceling Google One affects all three services, not just Drive.

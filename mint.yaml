free_alternatives:
- name: Credit Karma
  url: https://www.creditkarma.com
  note: Intuit's replacement for Mint — free budgeting, credit monitoring, and financial overview
- name: YNAB (You Need A Budget)
  url: https://www.youneedabudget.com
  note: Paid ($14.99/month or $99/year) but the gold standard for zero-based budgeting
- name: Monarch Money
  url: https://www.monarchmoney.com
  note: Popular Mint replacement ($9.99/month or $99.99/year) with modern UI and account aggregation
- name: Copilot Money
  url: https://copilot.money
  note: iOS/Mac budgeting app ($8.99/month) praised as a clean Mint alternative
notes: Mint (Intuit) shut down permanently on January 1, 2024, after 17 years of operation. Intuit migrated users' data to Credit Karma, which Intuit acquired in 2020. The shutdown was controversial as Mint was the most popular free personal finance app with over 3.6 million active users. If you're still seeing Intuit charges on your statement, they are likely related to other Intuit products (TurboTax, QuickBooks, Mailchimp) rather than Mint. The Mint shutdown catalyzed a wave of alternatives including Monarch Money, Copilot, and enhanced budgeting features in Credit Karma.

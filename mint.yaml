steps:
- step: 1
  instruction: Mint shut down permanently on January 1, 2024. The service no longer exists. Intuit migrated Mint users to Credit Karma. There is nothing to cancel.
  note: null
- step: 2
  instruction: 'If you have a Credit Karma account created via the Mint migration and want to close it: go to creditkarma.com > Settings > Account > Close Account. Closing Credit Karma does not affect your credit score or reports.'
  note: null
- step: 3
  instruction: If you're still seeing charges labeled 'Mint' or 'Intuit', these may be for other Intuit products (TurboTax, QuickBooks, Mailchimp). Check your Intuit account at accounts.intuit.com. Contact Intuit support at 1-800-446-8848 if unexplained charges persist.
  note: null

notes: ExpressVPN ($12.95/month, cheaper on multi-year plans) is a premium VPN service now owned by Kape Technologies (also owns CyberGhost, PIA, and ZenMate). The 30-day money-back guarantee is genuine but requires contacting live chat rather than self-service cancellation. The biggest consumer complaint is renewal pricing — promotional multi-year plans auto-renew at the full monthly rate, which can be a shock. Always check your renewal terms in account settings. ExpressVPN's jurisdiction is the British Virgin Islands, which is relevant for privacy considerations.

dark_patterns:
- type: renewal price shock
  description: Multi-year plans are sold at steep discounts (e.g., $6.67/month for 15 months) but auto-renew at the full monthly rate ($12.95/month), often doubling or tripling the effective price. This is not prominently disclosed.
- type: refund requires live chat
  description: The 30-day money-back guarantee cannot be processed through self-service — users must contact live chat support, which adds friction and exposes them to retention tactics.
retention_tactics:
- Live chat agents offer discounted plans during refund/cancellation requests.
- May offer extended free months to retain subscribers.
- Highlights security features and privacy protections you'll lose.

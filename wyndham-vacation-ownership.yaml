steps:
- step: 1
  instruction: 'CRITICAL: Check your contract immediately for the rescission (cancellation) period — typically 3 to 10 days depending on your state. This is the only penalty-free exit window. The rescission period begins the day you sign, not when you return home. Act immediately if you are within it.'
  note: null
- step: 2
  instruction: 'Within the rescission period: Write a cancellation letter stating your name, contract number, purchase date, and a clear statement that you are exercising your legal right to rescind. All signers must sign the letter.'
  note: null
- step: 3
  instruction: Send the letter via USPS Certified Mail with Return Receipt to the address specified in your contract. Keep the tracking receipt and the return receipt card permanently. The postmark date determines whether you beat the rescission deadline — not the delivery date.
  note: null
- step: 4
  instruction: 'After the rescission period: Contact Wyndham''s official exit program — Wyndham Cares — at wyndhamdestinations.com/us/en/wyndham-cares or call 1-855-965-0398. Wyndham Cares is the official deed-back and exit program. This is not an immediate cancellation — it involves a process and eligibility requirements.'
  note: null
- step: 5
  instruction: ⚠️ AVOID timeshare exit companies that charge upfront fees. The FTC and state AGs have pursued many of these as scams. Only use Wyndham's official program or a licensed attorney.
  note: null
dark_patterns:
- type: high-pressure sales tactics at purchase
  description: Timeshare sales presentations use multi-hour pressure sessions, fabricated urgency ('today only' pricing), and misleading investment claims. The rescission period exists specifically because of these practices.
- type: maintenance fee escalation
  description: Annual maintenance fees (typically $1,000-$3,000+/year for Wyndham) increase indefinitely and cannot be canceled separately from the ownership — you must exit the entire contract to stop them.
- type: no secondary market
  description: Wyndham timeshares have minimal resale value. Third-party 'buyers' offering to purchase your timeshare are frequently scams. Wyndham's own exit program (Wyndham Cares) may be your only legitimate exit path after the rescission period.
retention_tactics:
- Sales agents will call to 'save your membership' with discounts, point conversions, or hardship programs.
- Wyndham Cares may offer a pause on maintenance fees or a points conversion before processing a deed-back.
direct_cancel_url: https://www.wyndhamdestinations.com/us/en/wyndham-cares
free_alternatives: []
notes: Timeshare contracts are real estate contracts, not subscriptions. Canceling outside the rescission window requires using Wyndham's official exit program (Wyndham Cares), attempting resale (limited market), deed-back (if eligible), or consulting a licensed timeshare exit attorney. Stop paying maintenance fees without a formal exit and Wyndham may pursue collections or foreclosure affecting your credit. Do not pay upfront fees to any third-party exit company.

notes: Freshly (originally a fresh pre-made meal delivery service owned by Nestlé) was shut down by Nestlé in 2023, then the brand was acquired and relaunched as Freshly Frozen with a pivot to frozen meals. The service has undergone significant operational changes and reduced delivery areas. If you have an active subscription, verify your account status at freshlyfrozen.com. If you're having trouble canceling a legacy Freshly subscription, contact your bank to dispute any charges from a service that may have changed substantially from what you originally signed up for.

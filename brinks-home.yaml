notes: Brinks Home Security (formerly Monitronics) has had significant billing complaint history — customers report being charged after cancellation. Always get a cancellation confirmation number and watch your next 1-2 statements carefully. If you have equipment financing through a separate lender (GreenSky), that obligation continues regardless of monitoring cancellation.

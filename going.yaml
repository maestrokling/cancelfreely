notes: Going ($49/year for Elite, $199/year for Premium) sends curated flight deal alerts for domestic and international flights, often 40-90% off normal fares. Formerly known as Scott's Cheap Flights, rebranded in 2022. The free tier provides a taste of deals but limits to domestic economy only. Cancellation is clean with no friction. The Elite tier covers economy deals and the Premium tier adds business/first class deal alerts. The service has been consistently well-reviewed and the cancel process matches — straightforward and no-pressure.
